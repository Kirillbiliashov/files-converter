<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm rounded-4 p-4" style="width: 40%">
      <div class="card-body">
        <h3 class="card-title text-start mb-1 fw-bold">
          <span *ngIf="this.showLogin">Welcome back</span>
          <span *ngIf="!this.showLogin">Create an account</span>
        </h3>
        <p class="text-start text-muted mb-4">
          <span *ngIf="this.showLogin">Enter your email to sign in to your account</span>
          <span *ngIf="!this.showLogin">Enter your email below to create your account</span>
        </p>
        <form [formGroup]="this.userForm" (submit)="login()">
          <div class="mb-3" *ngIf="!this.showLogin">
            <label for="email" class="form-label fw-semibold">Name</label>
            <input
            formControlName="name"
              type="text"
              class="form-control"
              id="name"
              placeholder="John Doe"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input
            formControlName="email"
              type="email"
              class="form-control"
              id="email"
              placeholder="m@example.com"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input
            formControlName="password"
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>
          <div class="mb-3" *ngIf="!this.showLogin">
            <label for="password" class="form-label fw-semibold">Confirm Password</label>
            <input
            formControlName="confirmPassword"
              type="password"
              class="form-control"
              id="confirm-password"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
        </form>
        <div class="mt-3 text-center">
          <a  class=" text-decoration-none cursor-pointer" (click)="this.toggleFormMode()">
            <span *ngIf="this.showLogin">Don't have an account? Sign up</span>
            <span *ngIf="!this.showLogin">Already have an account? Sign in</span>
          </a>
        </div>
      </div>
    </div>
  </div>
