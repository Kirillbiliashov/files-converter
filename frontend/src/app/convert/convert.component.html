<style>
    /* Custom background color to match your screenshot */
    body {
        background-color: #f5f7fb !important;
        /* Adjust as needed */
    }
</style>

<div class="vw-100 vh-100" style=" background-color: #f5f7fb !important;">
    <div class="container py-5" style="height: 100vh; ">
        <!-- Card with shadow -->
        <div class="card shadow border-0" style="max-height: 100%; overflow-y: scroll; ">
            <!-- Header container with blue background & white text -->
            <div class="card-header bg-primary text-white py-4">
                <h3 class="fw-semibold mb-0">Files Converter</h3>
            </div>

            <!-- Card Body -->
            <div class="card-body" style="max-height: 100%; overflow-y: scroll; ">
                <!-- Top control buttons -->
                <div class="row g-2 mb-4">
                    <div class="col-auto">
                        <div >
                            <button (click)="fileInput.click()" class="btn btn-outline-primary">
                                <svg class="mb-1" width="16px" height="16px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#0061ff" stroke-width="0.72"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M12.5535 2.49392C12.4114 2.33852 12.2106 2.25 12 2.25C11.7894 2.25 11.5886 2.33852 11.4465 2.49392L7.44648 6.86892C7.16698 7.17462 7.18822 7.64902 7.49392 7.92852C7.79963 8.20802 8.27402 8.18678 8.55352 7.88108L11.25 4.9318V16C11.25 16.4142 11.5858 16.75 12 16.75C12.4142 16.75 12.75 16.4142 12.75 16V4.9318L15.4465 7.88108C15.726 8.18678 16.2004 8.20802 16.5061 7.92852C16.8118 7.64902 16.833 7.17462 16.5535 6.86892L12.5535 2.49392Z" fill="#0061ff"></path> <path d="M3.75 15C3.75 14.5858 3.41422 14.25 3 14.25C2.58579 14.25 2.25 14.5858 2.25 15V15.0549C2.24998 16.4225 2.24996 17.5248 2.36652 18.3918C2.48754 19.2919 2.74643 20.0497 3.34835 20.6516C3.95027 21.2536 4.70814 21.5125 5.60825 21.6335C6.47522 21.75 7.57754 21.75 8.94513 21.75H15.0549C16.4225 21.75 17.5248 21.75 18.3918 21.6335C19.2919 21.5125 20.0497 21.2536 20.6517 20.6516C21.2536 20.0497 21.5125 19.2919 21.6335 18.3918C21.75 17.5248 21.75 16.4225 21.75 15.0549V15C21.75 14.5858 21.4142 14.25 21 14.25C20.5858 14.25 20.25 14.5858 20.25 15C20.25 16.4354 20.2484 17.4365 20.1469 18.1919C20.0482 18.9257 19.8678 19.3142 19.591 19.591C19.3142 19.8678 18.9257 20.0482 18.1919 20.1469C17.4365 20.2484 16.4354 20.25 15 20.25H9C7.56459 20.25 6.56347 20.2484 5.80812 20.1469C5.07435 20.0482 4.68577 19.8678 4.40901 19.591C4.13225 19.3142 3.9518 18.9257 3.85315 18.1919C3.75159 17.4365 3.75 16.4354 3.75 15Z" fill="#0061ff"></path> </g></svg>
                                <span class="ms-2">Choose files</span>
                            </button>
                            <input #fileInput multiple class="form-control d-none" type="file" id="formFile" (change)="onFileSelected($event)">
                        </div>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary">
                            <svg class="mb-1" fill="#ffffff" width="14px" height="14px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff" stroke-width="0.72"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M1,12A11,11,0,0,1,17.882,2.7l1.411-1.41A1,1,0,0,1,21,2V6a1,1,0,0,1-1,1H16a1,1,0,0,1-.707-1.707l1.128-1.128A8.994,8.994,0,0,0,3,12a1,1,0,0,1-2,0Zm21-1a1,1,0,0,0-1,1,9.01,9.01,0,0,1-9,9,8.9,8.9,0,0,1-4.42-1.166l1.127-1.127A1,1,0,0,0,8,17H4a1,1,0,0,0-1,1v4a1,1,0,0,0,.617.924A.987.987,0,0,0,4,23a1,1,0,0,0,.707-.293L6.118,21.3A10.891,10.891,0,0,0,12,23,11.013,11.013,0,0,0,23,12,1,1,0,0,0,22,11Z"></path></g></svg>
                            <span class="ms-2">Convert all</span>
                        </button>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-outline-secondary">Remove All</button>
                    </div>
                </div>

                <!-- Rename pattern row -->
                <div class="row align-items-center g-2 mb-4">
                    <div class="col-auto">
                        <label for="renamePattern" class="col-form-label">
                            Rename pattern
                        </label>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="renamePattern"
                            placeholder="converted_{name}_{index}">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary">Apply Rename</button>
                    </div>
                </div>

                <!-- File list table -->
                <div class="table-responsive" style="max-height: 100%; overflow-y: scroll; ">
                    <table class="table align-middle mb-0">
                        <thead >
                            <tr >
                                <th class="text-muted fw-normal" scope="col">File</th>
                                <th class="text-muted fw-normal" scope="col">Size</th>
                                <th class="text-muted fw-normal" scope="col">Format</th>
                                <th class="text-muted fw-normal" scope="col">New Name</th>
                                <th class="text-muted fw-normal" scope="col">Status</th>
                                <th class="text-muted fw-normal" scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let fileItem of this.selectedFiles">
                                <td>{{fileItem.file.name}}</td>
                                <td>{{fileItem.file.size | formatBytes}}</td>
                                <td>
                                    <select class="form-select form-select-sm" [(ngModel)]="fileItem.selectedFormat">
                                        <option selected>Format</option>
                                        <option value="{{format}}" *ngFor="let format of fileItem.supportedFormats">{{format}}</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="text" class="form-control form-control-sm" placeholder="New file name">
                                </td>
                                <td>{{fileItem.status}}</td>
                                <td>
                                    <button class="btn btn-primary btn-sm" *ngIf="!fileItem.convertedBlob" [disabled]="!fileItem.selectedFormat || fileItem.selectedFormat == 'Format'" (click)="convertFile(fileItem)">Convert</button>
                                    <button class="btn btn-primary btn-sm" *ngIf="fileItem.convertedBlob" (click)="downloadFile(fileItem)">Download</button>
                                </td>
                            </tr>
                            <!-- Additional rows as needed -->
                        </tbody>
                    </table>
                </div>

            </div> 
        </div> 
    </div>
</div>
