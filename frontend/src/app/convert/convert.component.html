<style>
    /* Custom background color to match your screenshot */
    body {
        background-color: #f5f7fb !important;
        /* Adjust as needed */
    }
    table th, table td {
    background-color: transparent !important;
}
</style>

  <div  class="mx-4 mt-5 d-flex flex-column gap-4">
    <div class="row g-2">
        <div class="col-auto">
            <div >
                <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <svg class="mb-1" width="16px" height="16px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="white" stroke-width="0.72"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M12.5535 2.49392C12.4114 2.33852 12.2106 2.25 12 2.25C11.7894 2.25 11.5886 2.33852 11.4465 2.49392L7.44648 6.86892C7.16698 7.17462 7.18822 7.64902 7.49392 7.92852C7.79963 8.20802 8.27402 8.18678 8.55352 7.88108L11.25 4.9318V16C11.25 16.4142 11.5858 16.75 12 16.75C12.4142 16.75 12.75 16.4142 12.75 16V4.9318L15.4465 7.88108C15.726 8.18678 16.2004 8.20802 16.5061 7.92852C16.8118 7.64902 16.833 7.17462 16.5535 6.86892L12.5535 2.49392Z" fill="white"></path> <path d="M3.75 15C3.75 14.5858 3.41422 14.25 3 14.25C2.58579 14.25 2.25 14.5858 2.25 15V15.0549C2.24998 16.4225 2.24996 17.5248 2.36652 18.3918C2.48754 19.2919 2.74643 20.0497 3.34835 20.6516C3.95027 21.2536 4.70814 21.5125 5.60825 21.6335C6.47522 21.75 7.57754 21.75 8.94513 21.75H15.0549C16.4225 21.75 17.5248 21.75 18.3918 21.6335C19.2919 21.5125 20.0497 21.2536 20.6517 20.6516C21.2536 20.0497 21.5125 19.2919 21.6335 18.3918C21.75 17.5248 21.75 16.4225 21.75 15.0549V15C21.75 14.5858 21.4142 14.25 21 14.25C20.5858 14.25 20.25 14.5858 20.25 15C20.25 16.4354 20.2484 17.4365 20.1469 18.1919C20.0482 18.9257 19.8678 19.3142 19.591 19.591C19.3142 19.8678 18.9257 20.0482 18.1919 20.1469C17.4365 20.2484 16.4354 20.25 15 20.25H9C7.56459 20.25 6.56347 20.2484 5.80812 20.1469C5.07435 20.0482 4.68577 19.8678 4.40901 19.591C4.13225 19.3142 3.9518 18.9257 3.85315 18.1919C3.75159 17.4365 3.75 16.4354 3.75 15Z" fill="white"></path> </g></svg>
                        <span class="ms-2">Choose files</span>
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" (click)="fileInput.click()" >From My Device</a></li>
                        <li>
                            <a class="dropdown-item cursor-pointer" (click)="this.selectGoogleFile()" *ngIf="this.accessToken" >From Google Drive</a>
                            <a class="dropdown-item cursor-pointer" (click)="this.loginWithGoogle()" *ngIf="!this.accessToken">Connect Google Drive</a>
                        </li>
                      </ul>
                </div>
            </div>
            <input #fileInput multiple class="form-control d-none" type="file" id="formFile" (change)="this.onFileSelected($event)">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary" (click)="convertAllFiles()" [disabled]="this.selectedFiles.length == 0">
                <svg class="mb-1" fill="#0061ff" width="14px" height="14px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke="#0061ff" stroke-width="0.72"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M1,12A11,11,0,0,1,17.882,2.7l1.411-1.41A1,1,0,0,1,21,2V6a1,1,0,0,1-1,1H16a1,1,0,0,1-.707-1.707l1.128-1.128A8.994,8.994,0,0,0,3,12a1,1,0,0,1-2,0Zm21-1a1,1,0,0,0-1,1,9.01,9.01,0,0,1-9,9,8.9,8.9,0,0,1-4.42-1.166l1.127-1.127A1,1,0,0,0,8,17H4a1,1,0,0,0-1,1v4a1,1,0,0,0,.617.924A.987.987,0,0,0,4,23a1,1,0,0,0,.707-.293L6.118,21.3A10.891,10.891,0,0,0,12,23,11.013,11.013,0,0,0,23,12,1,1,0,0,0,22,11Z"></path></g></svg>
                <span class="ms-2">Convert all</span>
            </button>
        </div>
        <div class="col-auto">
            <button (click)="this.selectedFiles = []" class="btn btn-outline-danger">Remove All</button>
        </div>
    </div>


    <div class="row align-items-center g-2">
        <div class="col-auto">
            <label for="renamePattern" class="col-form-label">
                Rename pattern
            </label>
        </div>
        <div class="col">
            <input type="text" class="form-control" id="renamePattern"
                placeholder="converted_{name}_{index}">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary">Apply Rename</button>
        </div>
    </div>

    <div *ngIf="this.selectedFiles.length == 0" class="text-muted py-5 text-center">
        No files selected. Click "Choose Files" to begin conversion.
    </div>


    <div class="table-responsive" style="max-height: 100%; overflow-y: scroll; " *ngIf="this.selectedFiles.length > 0">
        <table class="table align-middle mb-0">
            <thead >
                <tr >
                    <th class="text-muted fw-normal" scope="col" style="background-color: transparent;">File</th>
                    <th class="text-muted fw-normal" scope="col">Size</th>
                    <th class="text-muted fw-normal" scope="col">Format</th>
                    <th class="text-muted fw-normal" scope="col">New Name</th>
                    <th class="text-muted fw-normal" scope="col">Status</th>
                    <th class="text-muted fw-normal" scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let fileItem of this.selectedFiles">
                    <td>{{fileItem.file.name}}</td>
                    <td>{{fileItem.file.size | formatBytes}}</td>
                    <td>
                        <select class="form-select form-select-sm" [(ngModel)]="fileItem.selectedFormat">
                            <option selected>Format</option>
                            <option value="{{format}}" *ngFor="let format of fileItem.supportedFormats">{{format}}</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" class="form-control form-control-sm" placeholder="New file name">
                    </td>
                    <td>
                        <div *ngIf="fileItem.status == 'Converting'" style="color: #0061ff; border-width: 1.5px;" class="spinner-border spinner-border-sm" role="status">
                            <span class="visually-hidden">Loading...</span>
                          </div>
                        {{fileItem.status}}</td>
                    <td>
                        <div class="d-flex">
                            <button class="btn btn-primary btn-sm" [disabled]="fileItem.status == 'Converting'" *ngIf="!fileItem.conversion" [disabled]="!fileItem.selectedFormat || fileItem.selectedFormat == 'Format'" (click)="convertFile(fileItem)">Convert</button>
                            <button class="btn btn-outline-primary btn-sm" *ngIf="fileItem.conversion" (click)="downloadFile(fileItem)">
                                <svg class="mb-1" width="16px" height="16px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#0061ff" stroke-width="0.72"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M12.5535 16.5061C12.4114 16.6615 12.2106 16.75 12 16.75C11.7894 16.75 11.5886 16.6615 11.4465 16.5061L7.44648 12.1311C7.16698 11.8254 7.18822 11.351 7.49392 11.0715C7.79963 10.792 8.27402 10.8132 8.55352 11.1189L11.25 14.0682V3C11.25 2.58579 11.5858 2.25 12 2.25C12.4142 2.25 12.75 2.58579 12.75 3V14.0682L15.4465 11.1189C15.726 10.8132 16.2004 10.792 16.5061 11.0715C16.8118 11.351 16.833 11.8254 16.5535 12.1311L12.5535 16.5061Z" fill="#0061ff"></path> <path d="M3.75 15C3.75 14.5858 3.41422 14.25 3 14.25C2.58579 14.25 2.25 14.5858 2.25 15V15.0549C2.24998 16.4225 2.24996 17.5248 2.36652 18.3918C2.48754 19.2919 2.74643 20.0497 3.34835 20.6516C3.95027 21.2536 4.70814 21.5125 5.60825 21.6335C6.47522 21.75 7.57754 21.75 8.94513 21.75H15.0549C16.4225 21.75 17.5248 21.75 18.3918 21.6335C19.2919 21.5125 20.0497 21.2536 20.6517 20.6516C21.2536 20.0497 21.5125 19.2919 21.6335 18.3918C21.75 17.5248 21.75 16.4225 21.75 15.0549V15C21.75 14.5858 21.4142 14.25 21 14.25C20.5858 14.25 20.25 14.5858 20.25 15C20.25 16.4354 20.2484 17.4365 20.1469 18.1919C20.0482 18.9257 19.8678 19.3142 19.591 19.591C19.3142 19.8678 18.9257 20.0482 18.1919 20.1469C17.4365 20.2484 16.4354 20.25 15 20.25H9C7.56459 20.25 6.56347 20.2484 5.80812 20.1469C5.07435 20.0482 4.68577 19.8678 4.40901 19.591C4.13225 19.3142 3.9518 18.9257 3.85315 18.1919C3.75159 17.4365 3.75 16.4354 3.75 15Z" fill="#0061ff"></path> </g></svg>
                                <span class="ms-2">Download</span>
                            </button>
                            <svg (click)="this.deleteFile(fileItem)"  style="cursor: pointer;" class="cursor-pointer mt-1 ms-2" width="22px" height="22px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 6H20M16 6L15.7294 5.18807C15.4671 4.40125 15.3359 4.00784 15.0927 3.71698C14.8779 3.46013 14.6021 3.26132 14.2905 3.13878C13.9376 3 13.523 3 12.6936 3H11.3064C10.477 3 10.0624 3 9.70951 3.13878C9.39792 3.26132 9.12208 3.46013 8.90729 3.71698C8.66405 4.00784 8.53292 4.40125 8.27064 5.18807L8 6M18 6V16.2C18 17.8802 18 18.7202 17.673 19.362C17.3854 19.9265 16.9265 20.3854 16.362 20.673C15.7202 21 14.8802 21 13.2 21H10.8C9.11984 21 8.27976 21 7.63803 20.673C7.07354 20.3854 6.6146 19.9265 6.32698 19.362C6 18.7202 6 17.8802 6 16.2V6M14 10V17M10 10V17" stroke="#0061ff" stroke-width="1.512" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

  </div>
